name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable legacy Pages from main root
        id: enable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "PUT legacy pages"
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/"
          echo "PUT_EXIT:$?"
          echo "POST legacy pages"
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/"
          echo "POST_EXIT:$?"
          if gh api "/repos/${{ github.repository }}/pages" > /tmp/pages.json; then
            echo "Pages site exists"
            cat /tmp/pages.json
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pages site still missing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Checkout
        if: steps.enable.outputs.enabled != 'true'
        uses: actions/checkout@v4

      - name: Upload site
        if: steps.enable.outputs.enabled != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.enable.outputs.enabled != 'true'
        uses: actions/deploy-pages@v4
